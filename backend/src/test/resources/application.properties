spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-256
jwt.expiration-ms=86400000
internal.service-token=dev-internal-secret-change-me
ai-service.base-url=http://localhost:8000
file.upload-dir=uploads-test
