spring.application.name=backend
server.port=${PORT:8081}

# Database Configuration (Defaults to persistent local H2 DB ./data/finassistdb, overridable with DB_URL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/finassistdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# File Upload Configuration
file.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Security & Tokens
jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha-256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
internal.service-token=${INTERNAL_SERVICE_TOKEN:dev-internal-secret-change-me}

# AI Service Base URL
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
